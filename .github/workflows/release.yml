name: Publish extension

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.16)"
        required: true
        type: string
      publish_marketplace:
        description: "Publish to VS Code Marketplace"
        required: false
        default: false
        type: boolean
      publish_open_vsx:
        description: "Publish to Open VSX"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.version }}" != "$PACKAGE_VERSION" ]; then
              echo "The requested version (${{ inputs.version }}) does not match package.json ($PACKAGE_VERSION)." >&2
              exit 1
            fi
          fi

          VERSION=$PACKAGE_VERSION

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Abort if no new version
        if: steps.version.outputs.skip == 'true'
        run: echo "No new version to release."

      - name: Setup Node
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview/shared/package-lock.json

      - name: Pin npm Version
        if: steps.version.outputs.skip != 'true'
        run: npm i -g npm@8.19.4

      - name: Install Root Dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Install Webview Dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm --prefix webview/shared ci

      - name: Build Extension + Webview
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Lint
        if: steps.version.outputs.skip != 'true'
        run: npm run lint

      - name: Run Tests
        if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Package VSIX
        if: steps.version.outputs.skip != 'true'
        run: npx @vscode/vsce package --out "opencode-vscode-chryzxc-${{ steps.version.outputs.version }}.vsix"

      - name: Create release tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Upload VSIX artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_marketplace)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.VSCE_PAT }}" ]; then
            npx @vscode/vsce publish --packagePath "opencode-vscode-chryzxc-${{ steps.version.outputs.version }}.vsix"
          else
            echo "VSCE_PAT secret not set, skipping marketplace publish"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: steps.version.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_open_vsx)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.OVSX_PAT }}" ]; then
            npx ovsx publish "opencode-vscode-chryzxc-${{ steps.version.outputs.version }}.vsix"
          else
            echo "OVSX_PAT secret not set, skipping Open VSX publish"
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: "*.vsix"
          generate_release_notes: true
          draft: false
          prerelease: false
