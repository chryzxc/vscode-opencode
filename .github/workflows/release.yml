name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.16)"
        required: true
        type: string
      publish_marketplace:
        description: "Publish to VS Code Marketplace"
        required: false
        default: false
        type: boolean
      publish_open_vsx:
        description: "Publish to Open VSX"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "skip_tag=1" >> "$GITHUB_OUTPUT"
            echo "Releasing version: ${{ inputs.version }}"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version detected: $VERSION"

      - name: Create release tag
        if: steps.version.outputs.skip_tag != '1' && steps.version.outputs.skip != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Abort if no new version
        if: steps.version.outputs.skip == 'true'
        run: echo "No new version to release."

      - name: Setup Node
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm Version
        if: steps.version.outputs.skip != 'true'
        run: npm i -g npm@8.19.4

      - name: Install Root Dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Install Webview Dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm --prefix webview/shared ci

      - name: Build Extension + Webview
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Lint
        if: steps.version.outputs.skip != 'true'
        run: npm run lint

      - name: Run Tests
        if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Package VSIX
        if: steps.version.outputs.skip != 'true'
        run: npx @vscode/vsce package --out "opencode-vscode-chryzxc-${{ steps.version.outputs.version }}.vsix"

      - name: Upload VSIX artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_marketplace) && secrets.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "opencode-vscode-chryzxc-${{ steps.version.outputs.version }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_open_vsx) && secrets.OVSX_PAT != ''
        run: npx ovsx publish "opencode-vscode-chryzxc-${{ steps.version.outputs.version }}.vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: "*.vsix"
          generate_release_notes: true
          draft: false
          prerelease: false
