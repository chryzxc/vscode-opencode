name: Verify extension

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview/shared/package-lock.json

      - name: Pin npm Version
        run: npm i -g npm@8.19.4

      - name: Show Tool Versions
        run: |
          node -v
          npm -v

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Webview Dependencies
        run: npm --prefix webview/shared ci

      - name: Validate Structured Output Contract
        run: npm run structured-output:check

      - name: Build Extension + Webview
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Full Regression Suite
        run: npm test
